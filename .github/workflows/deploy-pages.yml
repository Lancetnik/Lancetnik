name: Deploy site to Pages

on:
  push:
    branches: [pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling in-flight ones — Pages deployments
# for this site have been slow (>10 min); a cancelled deployment previously
# wedged the site in an "in progress deployment" state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # legacy pipeline's fixed 10-min timeout kept aborting slow deploys
          timeout: 1800000
